<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Audit & Diagnostic</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/ssdk-style.css">
    <style>
        body { padding: 40px; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); }
        .audit-container { max-width: 800px; margin: 0 auto; background: var(--bg2); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
        h1 { margin-top: 0; color: var(--accent); }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; }
        .log-box { margin-top: 20px; background: #000; color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; height: 400px; overflow-y: auto; white-space: pre-wrap; font-size: 0.9rem; }
        .error { color: #ff4757; }
        .success { color: #2ed573; }
        .warning { color: #ffa502; }
    </style>
</head>
<body>

<div class="audit-container">
    <h1>🔍 System Diagnostic & Audit</h1>
    <p>This will check all 150+ tools in your database to find broken links and missing files.</p>
    <button onclick="startAudit()" id="startBtn">Start Audit Now</button>
    
    <div class="log-box" id="logBox">Waiting to start...</div>
</div>

<script>
async function log(msg, type="info") {
    const box = document.getElementById("logBox");
    const color = type === "error" ? "#ff4757" : type === "success" ? "#2ed573" : type === "warning" ? "#ffa502" : "#fff";
    box.innerHTML += `<span style="color: ${color}">${msg}</span><br>`;
    box.scrollTop = box.scrollHeight;
}

async function startAudit() {
    document.getElementById("startBtn").disabled = true;
    document.getElementById("logBox").innerHTML = "";
    log("Fetching tools.json database...", "info");
    
    try {
        const res = await fetch("../assets/json/tools.json");
        if (!res.ok) throw new Error("Could not load tools.json");
        const tools = await res.json();
        
        log(`Found ${tools.length} tools. Starting verification... \n`, "success");
        
        let missing = 0;
        let working = 0;
        let missingToolsList = [];

        for (let i = 0; i < tools.length; i++) {
            const tool = tools[i];
            if (!tool.url) continue;
            
            try {
                // We use a HEAD request to check if the file exists without downloading the whole thing
                const checkRes = await fetch("../" + tool.url, { method: 'HEAD' });
                if (checkRes.ok) {
                    working++;
                    if (i % 10 === 0) log(`Checked ${i+1}/${tools.length}...`);
                } else {
                    missing++;
                    missingToolsList.push(`${tool.name} (${tool.url})`);
                    log(`[404 NOT FOUND] ${tool.name} - ${tool.url}`, "error");
                }
            } catch (e) {
                missing++;
                missingToolsList.push(`${tool.name} (${tool.url})`);
                log(`[ERROR] ${tool.name} - ${tool.url}`, "error");
            }
        }
        
        log("\n=============================", "info");
        log("🎉 AUDIT COMPLETE 🎉", "success");
        log(`Total Checked: ${tools.length}`);
        log(`✅ Working Files: ${working}`, "success");
        log(`❌ Broken Links: ${missing}`, missing > 0 ? "error" : "success");
        
        if (missing > 0) {
            log("\nList of broken tools to send to AI:", "warning");
            missingToolsList.forEach(t => log(" - " + t, "warning"));
        } else {
            log("\nALL TOOLS ARE WORKING PERFECTLY! No broken links found.", "success");
        }

    } catch (err) {
        log("Error: " + err.message, "error");
    }
}
</script>
</body>
</html>
