<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSDK Enterprise CMS</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/ssdk-style.css">
  
  <style>
    .admin-layout {
      display: flex;
      min-height: calc(100vh - 80px);
      margin-top: 80px;
      background: var(--bg);
    }
    
    .admin-sidebar {
      width: 280px;
      background: var(--card2);
      border-right: 1px solid var(--border);
      padding: 20px;
      backdrop-filter: blur(20px);
    }
    
    .admin-sidebar h2 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      color: var(--accent);
    }
    
    .admin-sidebar ul {
      list-style: none;
      padding: 0;
    }
    
    .admin-sidebar li {
      padding: 12px 15px;
      margin-bottom: 8px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }
    
    .admin-sidebar li:hover {
      background: rgba(168,85,247,0.1);
    }
    
    .admin-sidebar li.active {
      background: var(--accent);
      color: #fff;
    }
    
    .admin-content {
      flex: 1;
      padding: 40px;
      background: var(--bg2);
    }

    .admin-tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .admin-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .admin-card .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
    }

    .badge.active { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
    .badge.inactive { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

  </style>

  <!-- Boot core engine orchestration -->
  <script src="../core/bootstrap.js" type="module"></script>
</head>
<body>

<div class="bg-fx"></div>

<div class="admin-layout" id="adminContainer">
  <div style="padding: 100px; text-align: center; width: 100%;">
    <h2 class="text-3d">Authenticating...</h2>
    <p class="muted">Verifying enterprise JWT token via AdminEngine.</p>
  </div>
</div>

</body>
</html>
